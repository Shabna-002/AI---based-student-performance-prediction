<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EduPredict AI - Student Performance System{% endblock %}</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Chart.js for Animated Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: rgba(15, 23, 42, 0.72);
            --bg-card-hover: rgba(30, 41, 59, 0.85);
            --border-glass: rgba(255, 255, 255, 0.1);
            --border-glow: rgba(56, 189, 248, 0.45);
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 50%, #1d4ed8 100%);
            --ai-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            --accent-glow: 0 0 25px rgba(56, 189, 248, 0.25), 0 0 50px rgba(129, 140, 248, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        h1, h2, h3, h4, h5, h6, .navbar-brand {
            font-family: 'Outfit', 'Inter', sans-serif;
        }

        /* 1. Scroll Progress Indicator */
        #scroll-progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: transparent;
            z-index: 10000;
            pointer-events: none;
        }
        #scroll-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc, #ec4899);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.8), 0 0 20px rgba(192, 132, 252, 0.5);
            transition: width 0.1s ease-out;
        }

        /* 2 & 3. Neural-network & Floating Particles Canvas */
        #neural-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.85;
        }

        /* 14. Website Open Loading Animation (Preloader) */
        #app-preloader {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #0f172a 0%, #080c14 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s ease;
        }
        #app-preloader.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .preloader-content {
            text-align: center;
            position: relative;
        }
        .neural-spinner {
            width: 90px;
            height: 90px;
            margin: 0 auto 1.5rem;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .neural-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid transparent;
        }
        .ring-1 {
            border-top-color: #38bdf8;
            border-right-color: #818cf8;
            animation: spinRing 1.2s linear infinite;
        }
        .ring-2 {
            inset: 8px;
            border-bottom-color: #c084fc;
            border-left-color: #ec4899;
            animation: spinRingReverse 1.6s linear infinite;
        }
        .ring-3 {
            inset: 16px;
            border-top-color: #34d399;
            animation: spinRing 2s linear infinite;
        }
        .preloader-icon {
            font-size: 1.8rem;
            color: #38bdf8;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.7));
            animation: pulseGlow 1.5s ease-in-out infinite alternate;
        }
        .preloader-title {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }
        .preloader-status {
            font-size: 0.85rem;
            color: #94a3b8;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-weight: 500;
        }
        @keyframes spinRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes spinRingReverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
        @keyframes pulseGlow {
            from { transform: scale(0.95); opacity: 0.8; }
            to { transform: scale(1.1); opacity: 1; }
        }

        /* 4. Glassmorphism Utilities */
        .glass-panel, .card {
            background: var(--bg-card) !important;
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--border-glass) !important;
            border-radius: 1.25rem !important;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08) !important;
            color: var(--text-main);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .card-header {
            background: rgba(255, 255, 255, 0.03) !important;
            border-bottom: 1px solid var(--border-glass) !important;
            color: var(--text-main) !important;
            padding: 1.2rem 1.5rem;
            border-radius: 1.25rem 1.25rem 0 0 !important;
        }

        /* 5. Gradient Text */
        .gradient-text {
            background: var(--ai-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }
        .gradient-text-cyan {
            background: linear-gradient(135deg, #38bdf8 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }
        .gradient-text-emerald {
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }
        .gradient-text-amber {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        /* 6. Soft Glowing Borders */
        .glow-border {
            position: relative;
            border-color: rgba(56, 189, 248, 0.35) !important;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15), inset 0 0 15px rgba(129, 140, 248, 0.05);
        }
        .glow-border:hover, .card:hover {
            border-color: rgba(56, 189, 248, 0.6) !important;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6), 0 0 25px rgba(56, 189, 248, 0.25), inset 0 0 15px rgba(129, 140, 248, 0.1) !important;
        }

        /* 8 & 9. 3D Hover Cards & Tilt Effects */
        .tilt-card {
            transform-style: preserve-3d;
            perspective: 1000px;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s ease-out, box-shadow 0.25s ease;
            will-change: transform;
        }
        .tilt-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 255, 255, 0.12) 0%, transparent 65%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .tilt-card:hover::after {
            opacity: 1;
        }

        /* 10. Smooth Section Transitions (Reveal on scroll) */
        .reveal-on-scroll {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1), transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }
        .reveal-on-scroll.revealed {
            opacity: 1;
            transform: translateY(0);
        }
        .stagger-1 { transition-delay: 0.1s; }
        .stagger-2 { transition-delay: 0.2s; }
        .stagger-3 { transition-delay: 0.3s; }
        .stagger-4 { transition-delay: 0.4s; }

        /* 12. Micro-interactions & Buttons */
        .btn {
            position: relative;
            overflow: hidden;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn-primary {
            background: var(--ai-gradient) !important;
            border: none !important;
            color: #ffffff !important;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.35);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 25px rgba(56, 189, 248, 0.5);
            filter: brightness(1.08);
        }
        .btn-outline-primary {
            border: 1px solid rgba(56, 189, 248, 0.5) !important;
            color: #38bdf8 !important;
            background: rgba(56, 189, 248, 0.08) !important;
        }
        .btn-outline-primary:hover {
            background: rgba(56, 189, 248, 0.2) !important;
            border-color: #38bdf8 !important;
            color: #ffffff !important;
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.3);
        }
        .btn-outline-secondary {
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #cbd5e1 !important;
            background: rgba(255, 255, 255, 0.04) !important;
        }
        .btn-outline-secondary:hover {
            background: rgba(255, 255, 255, 0.1) !important;
            color: #ffffff !important;
            border-color: rgba(255, 255, 255, 0.3) !important;
        }

        /* Ripple effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            animation: rippleAnimation 0.6s linear;
            pointer-events: none;
        }
        @keyframes rippleAnimation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Form Controls Glass */
        .form-control, .form-select {
            background: rgba(15, 23, 42, 0.65) !important;
            border: 1px solid rgba(255, 255, 255, 0.14) !important;
            color: #f8fafc !important;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            transition: all 0.25s ease;
        }
        .form-control::placeholder {
            color: #64748b !important;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(15, 23, 42, 0.85) !important;
            border-color: #38bdf8 !important;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25), 0 0 15px rgba(56, 189, 248, 0.2) !important;
            color: #ffffff !important;
        }
        .input-group-text {
            background: rgba(15, 23, 42, 0.85) !important;
            border: 1px solid rgba(255, 255, 255, 0.14) !important;
            color: #94a3b8 !important;
            border-radius: 0.75rem 0 0 0.75rem;
        }

        /* Tables Glass */
        .table {
            color: #f8fafc !important;
            margin-bottom: 0;
            border-color: rgba(255, 255, 255, 0.08) !important;
        }
        .table thead th {
            background: rgba(15, 23, 42, 0.85) !important;
            color: #94a3b8 !important;
            font-size: 0.78rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
            padding: 1rem 1.25rem;
        }
        .table tbody td {
            background: transparent !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
            padding: 1rem 1.25rem;
            color: #e2e8f0 !important;
            transition: background 0.2s ease;
        }
        .table-hover tbody tr:hover td {
            background: rgba(56, 189, 248, 0.06) !important;
        }

        /* Pulse Dot */
        .pulse-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
            animation: pulseDot 1.8s infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes pulseDot {
            0% { transform: scale(0.9); opacity: 0.7; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.9); opacity: 0.7; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Navbar */
        .navbar-custom {
            background: rgba(11, 15, 25, 0.82) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .navbar-brand {
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #f8fafc !important;
            font-size: 1.3rem;
        }
        .nav-link {
            font-weight: 500;
            color: #94a3b8 !important;
            padding: 0.5rem 1.1rem !important;
            border-radius: 0.6rem;
            transition: all 0.25s ease;
        }
        .nav-link:hover {
            color: #38bdf8 !important;
            background: rgba(56, 189, 248, 0.1);
        }
        .nav-link.active {
            color: #ffffff !important;
            background: var(--primary-gradient) !important;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }

        /* 13. Back to Top Button */
        .back-to-top-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.8);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(56, 189, 248, 0.3);
        }
        .back-to-top-btn.visible {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }
        .back-to-top-btn:hover {
            background: #38bdf8;
            color: #0b0f19;
            box-shadow: 0 6px 25px rgba(56, 189, 248, 0.6);
            transform: scale(1.1) translateY(-3px);
        }
        .progress-ring {
            position: absolute;
            top: 0;
            left: 0;
            transform: rotate(-90deg);
            pointer-events: none;
        }
        .progress-ring-bg {
            fill: transparent;
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 3;
        }
        .progress-ring-circle {
            fill: transparent;
            stroke: #38bdf8;
            stroke-width: 3;
            stroke-dasharray: 125.6;
            stroke-dashoffset: 125.6;
            transition: stroke-dashoffset 0.1s linear;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 189, 248, 0.6);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 1. Scroll Progress Indicator -->
    <div id="scroll-progress-container">
        <div id="scroll-progress-bar"></div>
    </div>

    <!-- 2 & 3. Neural-network & Floating Particles Canvas -->
    <canvas id="neural-canvas"></canvas>

    <!-- 14. Website Open Loading Animation -->
    <div id="app-preloader">
        <div class="preloader-content">
            <div class="neural-spinner">
                <div class="neural-ring ring-1"></div>
                <div class="neural-ring ring-2"></div>
                <div class="neural-ring ring-3"></div>
                <i class="bi bi-cpu-fill preloader-icon"></i>
            </div>
            <div class="preloader-title gradient-text">EduPredict AI</div>
            <div class="preloader-status">
                <span class="pulse-dot"></span> Initializing Neural Engine...
            </div>
        </div>
    </div>

    {% if session.get('user') %}
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/dashboard">
                <i class="bi bi-mortarboard-fill text-info fs-4"></i>
                <span class="gradient-text">EduPredict AI</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-1">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/dashboard' %}active{% endif %}" href="/dashboard">
                            <i class="bi bi-speedometer2 me-1"></i> Performance Analytics
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/students' %}active{% endif %}" href="/students">
                            <i class="bi bi-people me-1"></i> Students
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/predict' %}active{% endif %}" href="/predict">
                            <i class="bi bi-cpu me-1"></i> AI Prediction
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span class="badge bg-secondary bg-opacity-25 text-light px-3 py-2 border border-secondary border-opacity-25 rounded-pill d-none d-md-inline-flex align-items-center">
                        <span class="pulse-dot"></span> {{ session.get('user') }}
                    </span>
                    <a href="/logout" class="btn btn-outline-danger btn-sm px-3 rounded-pill">
                        <i class="bi bi-box-arrow-right me-1"></i> Logout
                    </a>
                </div>
            </div>
        </div>
    </nav>
    {% endif %}

    <main class="py-4 position-relative">
        {% block content %}{% endblock %}
    </main>

    <!-- 13. Back to Top Button with Circular Progress -->
    <button id="backToTop" class="back-to-top-btn" title="Back to Top" aria-label="Back to Top">
        <svg class="progress-ring" width="48" height="48">
            <circle class="progress-ring-bg" cx="24" cy="24" r="20"></circle>
            <circle class="progress-ring-circle" id="progressRingCircle" cx="24" cy="24" r="20"></circle>
        </svg>
        <i class="bi bi-chevron-up"></i>
    </button>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Core Interactive Engine: Neural Canvas, 3D Tilt, Parallax, Progress & Micro-interactions -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- 14. Website Open Loading Animation Dismissal ---
            const preloader = document.getElementById('app-preloader');
            const dismissPreloader = () => {
                if (preloader && !preloader.classList.contains('fade-out')) {
                    preloader.classList.add('fade-out');
                    setTimeout(() => preloader.remove(), 650);
                }
            };
            window.addEventListener('load', dismissPreloader);
            setTimeout(dismissPreloader, 750); // Fallback so user never waits

            // --- 1. Scroll Progress Indicator & 13. Back To Top Ring ---
            const progressBar = document.getElementById('scroll-progress-bar');
            const backToTopBtn = document.getElementById('backToTop');
            const progressCircle = document.getElementById('progressRingCircle');
            const circumference = 2 * Math.PI * 20; // r = 20

            if (progressCircle) {
                progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
                progressCircle.style.strokeDashoffset = circumference;
            }

            const updateScrollMetrics = () => {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const scrollPercent = docHeight > 0 ? (scrollTop / docHeight) : 0;

                if (progressBar) {
                    progressBar.style.width = `${scrollPercent * 100}%`;
                }

                if (progressCircle) {
                    const offset = circumference - (scrollPercent * circumference);
                    progressCircle.style.strokeDashoffset = offset;
                }

                if (backToTopBtn) {
                    if (scrollTop > 200) {
                        backToTopBtn.classList.add('visible');
                    } else {
                        backToTopBtn.classList.remove('visible');
                    }
                }
            };

            window.addEventListener('scroll', updateScrollMetrics, { passive: true });
            updateScrollMetrics();

            if (backToTopBtn) {
                backToTopBtn.addEventListener('click', () => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }

            // --- 2 & 3. Neural-Network & Floating Particles Canvas Simulation ---
            const canvas = document.getElementById('neural-canvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                let width = canvas.width = window.innerWidth;
                let height = canvas.height = window.innerHeight;
                let mouse = { x: -1000, y: -1000, active: false };

                window.addEventListener('resize', () => {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                    initParticles();
                });

                window.addEventListener('mousemove', (e) => {
                    mouse.x = e.clientX;
                    mouse.y = e.clientY;
                    mouse.active = true;
                });

                window.addEventListener('mouseleave', () => {
                    mouse.active = false;
                });

                // Particle / Node generation
                const particles = [];
                const particleCount = Math.min(Math.floor((width * height) / 16000), 75);

                class Particle {
                    constructor() {
                        this.x = Math.random() * width;
                        this.y = Math.random() * height;
                        this.vx = (Math.random() - 0.5) * 0.75;
                        this.vy = (Math.random() - 0.5) * 0.75;
                        this.radius = Math.random() * 2 + 1.2;
                        this.baseRadius = this.radius;
                        // Floating particle color variety (Cyan, Indigo, Purple, Emerald)
                        const colors = ['#38bdf8', '#818cf8', '#c084fc', '#34d399'];
                        this.color = colors[Math.floor(Math.random() * colors.length)];
                        this.glow = Math.random() * 8 + 4;
                    }

                    update() {
                        this.x += this.vx;
                        this.y += this.vy;

                        if (this.x < 0 || this.x > width) this.vx *= -1;
                        if (this.y < 0 || this.y > height) this.vy *= -1;

                        // Mouse interaction / Parallax push
                        if (mouse.active) {
                            const dx = mouse.x - this.x;
                            const dy = mouse.y - this.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 120) {
                                const angle = Math.atan2(dy, dx);
                                this.x -= Math.cos(angle) * 1.5;
                                this.y -= Math.sin(angle) * 1.5;
                                this.radius = this.baseRadius * 1.6;
                            } else {
                                this.radius = this.baseRadius;
                            }
                        }
                    }

                    draw() {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                        ctx.fillStyle = this.color;
                        ctx.shadowBlur = this.glow;
                        ctx.shadowColor = this.color;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                }

                function initParticles() {
                    particles.length = 0;
                    for (let i = 0; i < particleCount; i++) {
                        particles.push(new Particle());
                    }
                }
                initParticles();

                function animate() {
                    ctx.clearRect(0, 0, width, height);

                    // Connect lines between nearby neural nodes
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);

                            if (dist < 130) {
                                const alpha = (1 - dist / 130) * 0.22;
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = `rgba(129, 140, 248, ${alpha})`;
                                ctx.lineWidth = 0.9;
                                ctx.stroke();
                            }
                        }

                        // Connect lines to mouse cursor
                        if (mouse.active) {
                            const dx = mouse.x - particles[i].x;
                            const dy = mouse.y - particles[i].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 150) {
                                const alpha = (1 - dist / 150) * 0.45;
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(mouse.x, mouse.y);
                                ctx.strokeStyle = `rgba(56, 189, 248, ${alpha})`;
                                ctx.lineWidth = 1.2;
                                ctx.stroke();
                            }
                        }

                        particles[i].update();
                        particles[i].draw();
                    }

                    requestAnimationFrame(animate);
                }
                animate();
            }

            // --- 8 & 9. 3D Hover Cards & Tilt Parallax ---
            const tiltCards = document.querySelectorAll('.tilt-card');
            tiltCards.forEach(card => {
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;

                    const rotateX = ((y - centerY) / centerY) * -10; // Max tilt 10deg
                    const rotateY = ((x - centerX) / centerX) * 10;

                    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-5px)`;
                    card.style.setProperty('--mouse-x', `${(x / rect.width) * 100}%`);
                    card.style.setProperty('--mouse-y', `${(y / rect.height) * 100}%`);
                });

                card.addEventListener('mouseleave', () => {
                    card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0)';
                });
            });

            // --- 10. Smooth Section Transitions (IntersectionObserver) ---
            const revealElements = document.querySelectorAll('.reveal-on-scroll');
            if ('IntersectionObserver' in window) {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('revealed');
                        }
                    });
                }, { threshold: 0.12 });

                revealElements.forEach(el => observer.observe(el));
            } else {
                revealElements.forEach(el => el.classList.add('revealed'));
            }

            // --- 7. Animated Statistics (Counters) ---
            const counters = document.querySelectorAll('.counter');
            const animateCounter = (el) => {
                const target = parseFloat(el.getAttribute('data-target'));
                const isFloat = target % 1 !== 0;
                const duration = 1500;
                const startTime = performance.now();

                const updateCount = (now) => {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    // Ease out expo
                    const ease = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
                    const current = target * ease;

                    el.textContent = isFloat ? current.toFixed(2) : Math.round(current);

                    if (progress < 1) {
                        requestAnimationFrame(updateCount);
                    } else {
                        el.textContent = isFloat ? target.toFixed(2) : target;
                    }
                };
                requestAnimationFrame(updateCount);
            };

            if ('IntersectionObserver' in window) {
                const counterObserver = new IntersectionObserver((entries, obs) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            animateCounter(entry.target);
                            obs.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.5 });
                counters.forEach(c => counterObserver.observe(c));
            } else {
                counters.forEach(animateCounter);
            }

            // --- 12. Micro-interactions: Button Ripple Effect ---
            document.querySelectorAll('.btn').forEach(button => {
                button.addEventListener('click', function(e) {
                    const rect = this.getBoundingClientRect();
                    const circle = document.createElement('span');
                    const diameter = Math.max(rect.width, rect.height);
                    const radius = diameter / 2;

                    circle.style.width = circle.style.height = `${diameter}px`;
                    circle.style.left = `${e.clientX - rect.left - radius}px`;
                    circle.style.top = `${e.clientY - rect.top - radius}px`;
                    circle.classList.add('ripple');

                    const ripple = this.querySelector('.ripple');
                    if (ripple) ripple.remove();

                    this.appendChild(circle);
                    setTimeout(() => circle.remove(), 600);
                });
            });
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
