<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EduPredict AI - Student Performance System{% endblock %}</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <!-- Three.js 3D WebGL Engine CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Global AI Futuristic Theme CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ai_futuristic_theme.css') }}">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #2563eb 0%, #7c3aed 50%, #c026d3 100%);
            --sidebar-bg: #070a14;
            --card-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.65), 0 0 30px rgba(99, 102, 241, 0.15);
            --hover-shadow: 0 28px 55px -10px rgba(0, 0, 0, 0.8), 0 0 40px rgba(168, 85, 247, 0.25);
        }
        html, body {
            font-family: 'Inter', sans-serif;
            background-color: #070a14 !important;
            background-image: 
                radial-gradient(circle at 12% 18%, rgba(56, 189, 248, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 88% 82%, rgba(168, 85, 247, 0.16) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.10) 0%, transparent 65%),
                linear-gradient(145deg, #070a14 0%, #0c1224 45%, #150d2b 100%) !important;
            background-attachment: fixed !important;
            color: #e2e8f0 !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        .navbar-custom {
            background: rgba(11, 17, 34, 0.85) !important;
            backdrop-filter: blur(16px) !important;
            -webkit-backdrop-filter: blur(16px) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4) !important;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #f8fafc !important;
            font-size: 1.25rem;
        }
        .navbar-brand .badge {
            font-size: 0.65rem;
            vertical-align: middle;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.3);
            font-weight: 600;
        }
        .nav-link {
            font-weight: 500;
            color: #94a3b8 !important;
            padding: 0.5rem 1rem !important;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }
        .nav-link:hover {
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.08);
        }
        .nav-link.active {
            color: #ffffff !important;
            background-color: rgba(99, 102, 241, 0.35) !important;
            border: 1px solid rgba(168, 85, 247, 0.35) !important;
        }
        .card {
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.28) !important;
            border-radius: 1.25rem !important;
            box-shadow: var(--card-shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: rgba(15, 23, 42, 0.75) !important;
            backdrop-filter: blur(20px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
            color: #f8fafc !important;
        }
        .card-header {
            background: rgba(255, 255, 255, 0.04) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
            padding: 1.2rem 1.5rem;
            font-weight: 600;
            color: #f8fafc !important;
            border-radius: 1.25rem 1.25rem 0 0 !important;
        }
        .stat-card {
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            overflow: hidden;
            position: relative;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--hover-shadow);
            border-color: rgba(168, 85, 247, 0.4) !important;
        }
        .stat-icon {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.85rem;
            font-size: 1.6rem;
        }
        .btn-primary {
            background: var(--primary-gradient);
            border: none;
            font-weight: 600;
            padding: 0.6rem 1.25rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            opacity: 0.93;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }
        .form-control, .form-select {
            border-radius: 0.65rem;
            border: 1px solid rgba(255, 255, 255, 0.14) !important;
            background: rgba(255, 255, 255, 0.05) !important;
            color: #f8fafc !important;
            padding: 0.65rem 0.9rem;
            font-size: 0.95rem;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: #a855f7 !important;
            color: #ffffff !important;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.25), 0 0 20px rgba(56, 189, 248, 0.25) !important;
        }
        .form-control::placeholder {
            color: #64748b !important;
        }
        .table {
            color: #e2e8f0 !important;
            --bs-table-bg: transparent !important;
            --bs-table-hover-bg: rgba(56, 189, 248, 0.06) !important;
            --bs-table-hover-color: #ffffff !important;
        }
        .table thead th {
            background: rgba(255, 255, 255, 0.04) !important;
            color: #94a3b8 !important;
            font-weight: 600;
            font-size: 0.825rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-top: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
            padding: 0.85rem 1rem;
        }
        .table tbody td {
            padding: 0.9rem 1rem;
            vertical-align: middle;
            color: #e2e8f0 !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06) !important;
            font-size: 0.95rem;
        }
        .bg-white, .bg-light {
            background-color: rgba(255, 255, 255, 0.05) !important;
            color: #f8fafc !important;
        }
        .text-dark {
            color: #f8fafc !important;
        }
        .text-muted, .text-secondary {
            color: #94a3b8 !important;
        }
        .border-bottom {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
        .border-top {
            border-top: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
        footer {
            margin-top: auto;
            background: rgba(11, 17, 34, 0.85) !important;
            backdrop-filter: blur(16px) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.08) !important;
            padding: 1.25rem 0;
            color: #94a3b8 !important;
            font-size: 0.875rem;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- =========================================================================
         3D EDUCATION & AI ANIMATION BACKGROUND (Three.js Fullscreen)
         ========================================================================= -->
    <canvas id="education-3d-canvas" class="education-3d-canvas"></canvas>
    <div class="education-3d-overlay"></div>
    <div id="education-mobile-fallback" class="education-mobile-fallback"></div>

    {% if session.get('user') %}
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/dashboard">
                <i class="bi bi-mortarboard-fill text-primary fs-4"></i>
                <span>EduPredict AI</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-1">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/dashboard' %}active{% endif %}" href="/dashboard">
                            <i class="bi bi-speedometer2 me-1"></i> Performance Analytics
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/students' %}active{% endif %}" href="/students">
                            <i class="bi bi-people me-1"></i> Students
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/predict' %}active{% endif %}" href="/predict">
                            <i class="bi bi-cpu me-1"></i> AI Prediction
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path.startswith('/what-if') %}active{% endif %}" href="/what-if">
                            <i class="bi bi-sliders me-1"></i> What-If Simulator
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a href="/logout" class="btn btn-outline-danger btn-sm px-3 rounded-pill">
                        <i class="bi bi-box-arrow-right me-1"></i> Logout
                    </a>
                </div>
            </div>
        </div>
    </nav>

    {% endif %}

    <main class="py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 3D Education & AI Animation Background Engine -->
    <script src="{{ url_for('static', filename='js/three_education_bg.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
