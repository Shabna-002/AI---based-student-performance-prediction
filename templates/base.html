<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EduPredict AI - Student Performance System{% endblock %}</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Chart.js 4.4 for Animated Visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            --sidebar-bg: #0f172a;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            --hover-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* 1. Scroll Progress Indicator */
        .scroll-progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3.5px;
            width: 0%;
            background: linear-gradient(90deg, #2563eb 0%, #38bdf8 50%, #818cf8 100%);
            z-index: 99999;
            transition: width 0.08s ease-out;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.85);
        }

        /* 2. Loading Animation / Preloader */
        .page-preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(248, 250, 252, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }
        .page-preloader.loaded {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .preloader-box {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.85rem;
        }
        .preloader-ring {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3.5px solid rgba(37, 99, 235, 0.15);
            border-top-color: #2563eb;
            border-right-color: #38bdf8;
            animation: spinLoader 0.75s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            box-shadow: 0 0 18px rgba(37, 99, 235, 0.25);
        }
        @keyframes spinLoader {
            to { transform: rotate(360deg); }
        }

        /* 3. Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #2563eb 0%, #06b6d4 50%, #4f46e5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .gradient-text-accent {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 4. Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.82) !important;
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.6) !important;
        }
        .glass-dark {
            background: rgba(15, 23, 42, 0.78) !important;
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
        }

        /* 5. Soft Glowing Borders */
        .glow-border {
            border: 1px solid rgba(59, 130, 246, 0.28) !important;
            box-shadow: 0 0 16px rgba(37, 99, 235, 0.08), var(--card-shadow);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glow-border:hover {
            border-color: rgba(59, 130, 246, 0.55) !important;
            box-shadow: 0 0 24px rgba(37, 99, 235, 0.2), var(--hover-shadow);
        }
        .glow-border-success {
            border: 1px solid rgba(16, 185, 129, 0.28) !important;
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.08), var(--card-shadow);
            transition: all 0.3s ease;
        }
        .glow-border-success:hover {
            border-color: rgba(16, 185, 129, 0.55) !important;
            box-shadow: 0 0 24px rgba(16, 185, 129, 0.2), var(--hover-shadow);
        }
        .glow-border-warning {
            border: 1px solid rgba(245, 158, 11, 0.28) !important;
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.08), var(--card-shadow);
            transition: all 0.3s ease;
        }
        .glow-border-warning:hover {
            border-color: rgba(245, 158, 11, 0.55) !important;
            box-shadow: 0 0 24px rgba(245, 158, 11, 0.2), var(--hover-shadow);
        }

        .navbar-custom {
            background: rgba(15, 23, 42, 0.92) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #f8fafc !important;
            font-size: 1.25rem;
            transition: transform 0.2s ease;
        }
        .navbar-brand:hover {
            transform: scale(1.02);
        }
        .navbar-brand .badge {
            font-size: 0.65rem;
            vertical-align: middle;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.3);
            font-weight: 600;
        }
        .nav-link {
            font-weight: 500;
            color: #94a3b8 !important;
            padding: 0.5rem 1rem !important;
            border-radius: 0.5rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-link:hover {
            color: #ffffff !important;
            background-color: rgba(255, 255, 255, 0.08);
            transform: translateY(-1px);
        }
        .nav-link.active {
            color: #ffffff !important;
            background: var(--primary-gradient) !important;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .card {
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            box-shadow: var(--card-shadow);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease, border-color 0.25s ease;
            background-color: #ffffff;
        }
        .card-header {
            background-color: transparent;
            border-bottom: 1px solid #f1f5f9;
            padding: 1.2rem 1.5rem;
            font-weight: 600;
            border-radius: 1rem 1rem 0 0 !important;
        }
        .stat-card {
            border: none;
            overflow: hidden;
            position: relative;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--hover-shadow);
        }
        .stat-icon {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.85rem;
            font-size: 1.6rem;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .stat-card:hover .stat-icon {
            transform: scale(1.12) rotate(4deg);
        }

        /* Micro-interactions */
        .btn {
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(1px) scale(0.98);
        }
        .btn-primary {
            background: var(--primary-gradient);
            border: none;
            padding: 0.6rem 1.25rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        .btn-primary:hover {
            opacity: 0.95;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }
        .form-control, .form-select {
            border-radius: 0.5rem;
            border-color: #cbd5e1;
            padding: 0.65rem 0.9rem;
            font-size: 0.95rem;
            transition: all 0.22s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 3.5px rgba(59, 130, 246, 0.18), 0 0 12px rgba(59, 130, 246, 0.22) !important;
        }
        .badge {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .badge:hover {
            transform: scale(1.04);
        }

        /* 6. Smooth Section Transitions */
        .reveal-section {
            opacity: 0;
            transform: translateY(18px);
            transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1), transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal-section.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 7. Back to Top Button */
        .back-to-top-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            cursor: pointer;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transform: translateY(16px) scale(0.9);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .back-to-top-btn.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }
        .back-to-top-btn:hover {
            transform: translateY(-3px) scale(1.08);
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.45);
            color: #ffffff;
        }
        .back-to-top-btn:active {
            transform: translateY(0) scale(0.95);
        }

        .table thead th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 600;
            font-size: 0.825rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-top: none;
            padding: 0.85rem 1rem;
        }
        .table tbody td {
            padding: 0.9rem 1rem;
            vertical-align: middle;
            color: #334155;
            font-size: 0.95rem;
        }
        footer {
            margin-top: auto;
            background-color: #ffffff;
            border-top: 1px solid #e2e8f0;
            padding: 1.25rem 0;
            color: #64748b;
            font-size: 0.875rem;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Scroll Progress Indicator -->
    <div id="scroll-progress" class="scroll-progress-bar"></div>

    <!-- Page Preloader / Opening Animation -->
    <div id="page-preloader" class="page-preloader">
        <div class="preloader-box">
            <div class="preloader-ring"></div>
            <div class="d-flex align-items-center gap-2 mt-2">
                <i class="bi bi-mortarboard-fill text-primary fs-5"></i>
                <span class="gradient-text fw-bold fs-5">EduPredict AI</span>
            </div>
            <div class="text-muted small">Loading intelligence system...</div>
        </div>
    </div>

    <!-- Back to Top Button -->
    <button id="back-to-top" class="back-to-top-btn" aria-label="Back to top" title="Back to top">
        <i class="bi bi-chevron-up"></i>
    </button>

    {% if session.get('user') %}
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/dashboard">
                <i class="bi bi-mortarboard-fill text-primary fs-4"></i>
                <span>EduPredict AI</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-1">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/dashboard' %}active{% endif %}" href="/dashboard">
                            <i class="bi bi-speedometer2 me-1"></i> Performance Analytics
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/students' %}active{% endif %}" href="/students">
                            <i class="bi bi-people me-1"></i> Students
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/predict' %}active{% endif %}" href="/predict">
                            <i class="bi bi-cpu me-1"></i> AI Prediction
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <a href="/logout" class="btn btn-outline-danger btn-sm px-3 rounded-pill">
                        <i class="bi bi-box-arrow-right me-1"></i> Logout
                    </a>
                </div>
            </div>
        </div>
    </nav>
    {% endif %}

    <main class="py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 1. Preloader Dismissal (with safe 600ms timeout)
        function dismissPreloader() {
            const preloader = document.getElementById('page-preloader');
            if (preloader && !preloader.classList.contains('loaded')) {
                preloader.classList.add('loaded');
                setTimeout(() => { if (preloader.parentNode) preloader.style.display = 'none'; }, 400);
            }
        }
        window.addEventListener('load', dismissPreloader);
        setTimeout(dismissPreloader, 600);

        // 2. Scroll Progress & Back to Top Handlers
        const progressBar = document.getElementById('scroll-progress');
        const backToTopBtn = document.getElementById('back-to-top');

        window.addEventListener('scroll', () => {
            const winScroll = document.documentElement.scrollTop || document.body.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
            if (progressBar) progressBar.style.width = scrolled + '%';

            if (backToTopBtn) {
                if (winScroll > 200) {
                    backToTopBtn.classList.add('visible');
                } else {
                    backToTopBtn.classList.remove('visible');
                }
            }
        });

        if (backToTopBtn) {
            backToTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        // 3. Smooth Section Transitions (Reveal on scroll)
        function initRevealSections() {
            const revealElements = document.querySelectorAll('.reveal-section');
            if ('IntersectionObserver' in window) {
                const observer = new IntersectionObserver((entries, obs) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            obs.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1 });

                revealElements.forEach(el => observer.observe(el));
            } else {
                revealElements.forEach(el => el.classList.add('is-visible'));
            }
        }

        // 4. Animated Statistics Counter Engine
        function animateCounters() {
            const counters = document.querySelectorAll('.counter-val');
            counters.forEach(counter => {
                const rawTarget = counter.getAttribute('data-target') || counter.innerText;
                const isFloat = rawTarget.includes('.');
                const target = parseFloat(rawTarget);
                if (isNaN(target)) return;

                const duration = 1200;
                const startTime = performance.now();

                function updateCounter(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    // Ease-out quartic
                    const ease = 1 - Math.pow(1 - progress, 4);
                    const current = target * ease;

                    counter.innerText = isFloat ? current.toFixed(1) : Math.round(current);

                    if (progress < 1) {
                        requestAnimationFrame(updateCounter);
                    } else {
                        counter.innerText = isFloat ? target.toFixed(1) : target;
                    }
                }
                requestAnimationFrame(updateCounter);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initRevealSections();
            animateCounters();
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
